@if (isOpen()) {
  <div class="confirm-modal" role="dialog" aria-modal="true" aria-labelledby="confirm-modal-title">
    <div class="confirm-modal__dialog">
      <div class="confirm-modal__header">
        <div class="confirm-modal__icon">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor">
            <path
              stroke-linecap="round"
              stroke-linejoin="round"
              stroke-width="2"
              d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
            />
          </svg>
        </div>
        <h3 id="confirm-modal-title" class="confirm-modal__title">Reiniciar progreso</h3>
      </div>

      <p class="confirm-modal__description">
        ¿Estás seguro de que deseas borrar el estado guardado de los 5 retos prácticos y del checklist de calidad?
      </p>

      <div class="confirm-modal__actions">
        <button type="button" class="confirm-modal__btn confirm-modal__btn--cancel" (click)="onCancel()">
          Cancelar
        </button>
        <button type="button" class="confirm-modal__btn confirm-modal__btn--confirm" (click)="onConfirm()">
          Sí, reiniciar todo
        </button>
      </div>
    </div>
  </div>
}
